# Cortex -- MCP Server Configuration
# Source of truth for all proxied MCP servers.
#
# Variables: $HOME (user home), $PROJECT_ROOT (cortex install dir)
# Vendored servers use 'entry' (relative to $PROJECT_ROOT), always launched via node.
# External servers use 'command' + 'args' (spawned stdio child), OR 'url' (Streamable
# HTTP endpoint of an already-running daemon -- nothing is spawned; sessions/state live
# in the daemon and survive cortex restarts). 'tool_prefix' (optional, either kind)
# prefixes remote tool names on registration for daemons that list bare names.
# External servers can pull env vars from ~/.claude.json via `env_from_claude: <server-name>`
# (e.g. brave-search uses this for BRAVE_API_KEY without putting it in this file).
#
# To add your own server:
#   1. Add an entry below (external or vendored)
#   2. Set discovery_state to the state where its tools should appear
#   3. List curated_tools (only these appear in the state; others are discoverable via free_explore)
#   4. Restart cortex
#
# Example: adding a Datadog MCP server
#   datadog:
#     command: node
#     args: [path/to/datadog-mcp/server.js]
#     discovery_state: debug
#     curated_tools:
#       - dd_search_logs
#       - dd_top_values

external:
  playwright:
    command: npx
    args:
      [
        -y,
        '@playwright/mcp@latest',
        --user-data-dir,
        '$HOME/Playwright-MCP-Cortex-Profile',
        --viewport-size,
        '1920x1080',
      ]
    discovery_state: browse
    curated_tools:
      - browser_navigate
      - browser_snapshot
      - browser_click
      - browser_type
      - browser_evaluate
      - browser_take_screenshot
      - browser_wait_for
      - browser_tabs

  # Search fallback, not the default. Demoted on the 07.08.2026 three-channel bakeoff:
  # google-search reached ~25 productive domains to Brave's ~13, and Brave rate-limits at
  # 4-wide parallel batches. Reach for this when google-search returns rate_limited.
  #
  # google-search is not proxied here on purpose. It is always-on via ~/.claude.json, so
  # it is reachable as mcp__google-search__* regardless of state; proxying it here (now
  # possible with a 'url' entry) would only duplicate that surface.
  brave-search:
    command: npx
    args: [-y, '@brave/brave-search-mcp-server']
    discovery_state: recon
    curated_tools:
      - brave_web_search
    env:
      BRAVE_API_KEY: ''
    env_from_claude: brave-search

  # The shared isession daemon (~/rig/isession, http_server.py on :8765) -- interactive
  # PTY sessions held OUTSIDE cortex, so they survive cortex restarts and live in one
  # namespace with Claude Code and pi (a session opened here is visible to the wake tick).
  # The daemon lists bare tool names (open, send, ...); tool_prefix restores isession_*.
  # events drains the readiness mailbox; open(no_wake=true) keeps a session you are
  # actively driving out of it. If the daemon is down, cortex logs one line and starts
  # without these tools (non-fatal).
  isession:
    url: http://127.0.0.1:8765/mcp
    tool_prefix: isession_
    discovery_state: free
    curated_tools:
      - isession_open
      - isession_send
      - isession_read
      - isession_wait
      - isession_signal
      - isession_close
      - isession_list
      - isession_events

vendored:
  github:
    entry: servers/github/dist/mcp/server.js
    discovery_state: recon
    curated_tools:
      - get_commit
      - list_commits
      - get_file_contents
      - list_branches
      - search_code
      - search_repositories
      - search_users
      - get_me
      - get_teams
      - get_team_members
      - list_pull_requests
      - pull_request_read
      - search_pull_requests

  commands:
    entry: servers/commands/build/index.js
    discovery_state: implement
    curated_tools:
      - run_command

  inspector:
    entry: servers/inspector/dist/server.js
    discovery_state: debug
    curated_tools:
      - insp_connect
      - insp_disconnect
      - insp_tools_list
      - insp_tools_call
      - insp_read_events
      - insp_list_sessions
      - insp_inject_steering
      - insp_prompts_list
      - insp_prompts_get
      - insp_resources_list
      - insp_resources_read
      - insp_resources_templates
