# Cortex -- Pathway Definitions
# Named workflow sequences with per-state guidance.
#
# These are starting points. Add your own for recurring workflows:
#   1. Pick a sequence of states that matches your pattern
#   2. Write guidance steps for each state
#   3. Use it: task_create(title, pathway="your-pathway")
#
# For one-off workflows, use pathway_generate instead (dynamic, LLM-generated).
# See BRIDGES.md for examples of both static and dynamic pathways.

golden:
  description: 'Feature development: understand, plan, build, verify, ship'
  initial_state: recon
  sequence: [recon, plan, implement, validate, review]
  guidance:
    recon:
      - 'Look up the ticket/issue in your issue tracker (could be an external tool paired with cortex)'
      - 'Search documentation for acceptance criteria and context'
      - 'Check git history and open PRs for parallel work'
      - 'Read relevant source files, check existing tests'
      - 'Pre-check: grep for existing types/interfaces before defining new ones'
      - 'recon_checkpoint: summarize findings, risks, and suggested approach'
    plan:
      - 'Draft plan sections: what changes, where, why'
      - 'plan_validate: did you READ every file you reference? Signatures accurate?'
      - 'Scope audit: list ALL code paths this change touches. Missing one = production bug.'
      - 'If touching schemas: verify the transformation shape separately.'
      - 'Disconfirmation: spend equal time trying to disprove your approach'
      - 'plan_approve to transition to implement'
    implement:
      - "Follow your project's conventions and patterns"
      - 'impl_test after each significant change'
      - 'impl_checkpoint regularly -- findings survive session death'
      - 'impl_stuck if blocked'
    validate:
      - 'validate_prerequisites -- check local env is ready'
      - 'validate_setup -- get recipes for local testing'
      - 'validate_advance to L2 for flow verification'
      - 'validate_integration_flow -- check pipeline stages for your entity'
      - 'validate_advance to L3 if browser/E2E verification needed'
      - "When satisfied -> enter_state('review')"
    review:
      - 'review_diff_summary -- see all changes at a glance'
      - 'review_simulate with relevant reviewer archetypes'
      - 'review_checklist -- standards compliance'
      - 'review_ready when all checks pass'
  exit_criteria:
    recon:
      - 'At least one recon_checkpoint finding saved'
      - 'Ticket/issue context extracted (acceptance criteria or equivalent)'
      - 'Parallel PRs or open branches on the same files surveyed'
    plan:
      - 'plan_approve called'
      - 'Disconfirmation attempt recorded -- time spent trying to break the approach'
    implement:
      - 'impl_test green on the change set'
      - 'impl_checkpoint saved with what-changed and why'
    validate:
      - 'validate_advance reached the level appropriate to the change (L1/L2/L3)'
      - 'validate_integration_flow green for the target entity, or local CI green'
    review:
      - 'review_simulate run with relevant reviewer archetypes'
      - 'review_ready called'

investigation:
  description: 'Bug hunt: diagnose, fix, verify, ship'
  initial_state: debug
  sequence: [debug, implement, validate, review]
  guidance:
    debug:
      l1:
        - 'Pick ONE representative case -- specific entity, request, or ID'
        - 'Classify early: DATA issue, CONFIG gap, or CODE bug. Each has a different path. Data corruption needs timeline reconstruction. Config gap needs comparative analysis. Code bug needs trace correlation.'
        - 'Find a CONTROL CASE -- a similar entity where behavior is correct. Compare side-by-side before deep-diving the broken one. The differing field is usually the root cause.'
        - 'debug_hypothesis with confidence % before querying anything'
        - 'Check logs via your observability platform (could be an external tool paired with cortex). Scope every query to env (sandbox / staging / production). A platform that spans envs returns mixed results without scoping -- prod logs misread as sandbox is a 30-minute detour.'
        - 'Include audit metadata (updatedAt/updatedBy or equivalent) in every database read. Live systems mutate while you investigate; without audit fields the mutation is invisible until query four.'
        - 'When querying docs or a knowledge base, ask the NORMAL mechanism first ("how does X work"), then the recovery mechanism ("how to fix when X fails"). Recovery paths and default paths look alike in docs -- conflating them causes misdiagnosis.'
        - 'debug_advance to L2 when hypothesis points at data or config'
      l2:
        - 'debug_db_query for database investigation. Include audit metadata in projections.'
        - 'On long investigations (more than ~10 minutes on a live system), re-check audit metadata on key documents to detect external mutations under you.'
        - 'debug_advance to L3 if the cause crosses services'
      l3:
        - 'debug_distributed_trace for cross-service correlation'
        - 'debug_root_cause when you have evidence'
    implement:
      - 'Fix should be minimal and targeted -- address root cause only'
      - 'impl_test -- verify the fix, check for regressions'
      - 'impl_checkpoint with root cause reference'
    validate:
      - 'Run your CI checks locally'
      - 'validate_integration_flow if the bug affected a transaction flow'
    review:
      - 'review_diff_summary'
      - 'Verify fix addresses the root cause recorded in debug'
      - 'review_checklist'
      - 'review_ready'
  exit_criteria:
    debug:
      l1:
        - 'Hypothesis recorded with confidence %'
        - 'Issue classified: DATA issue, CONFIG gap, or CODE bug'
        - 'Control case identified (a working instance of the same shape)'
        - 'Observability queries scoped to env'
      l2:
        - 'Audit metadata checked on the broken-case document'
      l3:
        - 'debug_root_cause recorded with evidence when hypothesis confirmed'
    implement:
      - 'Fix is minimal and targeted at the recorded root cause'
      - 'impl_test green'
    validate:
      - 'validate_integration_flow run for the specific entity that first triggered the bug'
    review:
      - 'review_ready called'
      - 'PR description references the recorded root cause'

knowledge:
  description: 'Quick answer: understand and respond, no building'
  initial_state: recon
  sequence: [recon]
  guidance:
    recon:
      - 'Search your documentation and knowledge base'
      - 'Read source files if code-level answer needed'
      - 'Use web search if external context needed'
      - 'recon_checkpoint with the answer'
      - 'Done -- task complete'
  exit_criteria:
    recon:
      - 'Answer formed and saved via recon_checkpoint'
      - 'Primary sources cited (docs, source with file:line, or external reference)'

e2e_verify:
  description: 'Standalone E2E verification: validate environment, flows, and UI'
  initial_state: validate
  sequence: [validate]
  guidance:
    validate:
      l1:
        - 'validate_prerequisites -- check ports, credentials, services'
        - 'validate_setup for each environment component'
        - 'Fix any prerequisites that fail before advancing'
      l2:
        - 'validate_integration_flow -- full entity health check'
        - 'Cross-reference with your database if discrepancies found'
      l3:
        - 'browser_navigate to the application under test'
        - 'browser_snapshot to verify page loaded correctly'
        - 'Walk through critical user journey'
        - 'browser_take_screenshot as evidence'
  exit_criteria:
    validate:
      l1:
        - 'Prerequisites all green; no unresolved setup failures'
      l2:
        - 'validate_integration_flow returned green for the target entity'
        - 'Discrepancies (if any) resolved or documented'
      l3:
        - 'Critical user journey completed end-to-end in the browser'
        - 'Evidence captured via browser_take_screenshot'

code_review:
  description: "Code review: understand context, then review someone else's PR"
  initial_state: recon
  sequence: [recon, review]
  guidance:
    recon:
      - 'PR metadata: author, description, labels, CI status'
      - 'Scope scan: count files and lines. Big PR = flag early.'
      - 'Ticket context: look up the issue in your tracker (could be an external tool paired with cortex)'
      - 'Author context: how many commits has this person made in the changed files? First-timer or expert? Are there companion PRs by the same author touching adjacent code?'
      - 'Parallel work: any other PRs touching the same files? Merge conflict risk. Flag before you waste review effort.'
      - 'File history: recent churn? Active refactor? Stable area touched for the first time?'
      - 'Branch freshness: how far behind main? Stale branch = likely conflicts post-approval.'
      - "CI: is the pipeline green? Don't review failing code unless failure is unrelated."
      - 'recon_checkpoint: ticket context, author familiarity, parallel work risk, CI status.'
    review:
      l1:
        - 'Read diff line by line. Type safety: casts, any, optional mismatches?'
        - 'Test coverage: new paths tested? Tests test behavior or just structure?'
        - 'Pattern conformance: repo conventions? Naming? File structure?'
        - 'Dead code: unused additions? Stale code that should have been removed?'
      l2:
        - 'AC match: map each criterion to specific diff lines. Unaddressed AC? Scope creep?'
        - 'Algorithm: correct result for all inputs?'
        - 'Edge cases: empty arrays, null, boundaries, concurrency, error paths'
        - 'Error handling: catch blocks add value or just swallow/rethrow?'
      l3:
        - 'Schema/API changes: backward compatible? Consumers updated?'
        - 'Cross-repo: companion PRs needed? Shared package type changes?'
        - 'Deploy: independent deploy? Ordering dependency? Migration needed?'
        - 'Performance: N+1? Unbounded loops? Missing pagination?'
        - 'Security: injection? Auth changes? Sensitive data in logs/responses?'
      verdict:
        - 'Classify findings: blockers (must fix), suggestions (should fix), nits (nice to fix)'
        - 'Draft review with specific file:line references'
        - 'Verdict: approve / request-changes / comment-only'
        - 'If request-changes: suggest solutions, not just problems. A finding without a path forward is review friction.'
  exit_criteria:
    recon:
      - 'PR scope understood: author, labels, CI status, file count'
      - 'Ticket/issue context mapped; parallel-work risk assessed'
      - 'recon_checkpoint states what you EXPECT the diff to do'
    review:
      - 'review_simulate run across relevant personas'
      - 'Findings classified: blockers / suggestions / nits'
      - 'Verdict decided and written up with file:line references'

free_roam:
  description: "Open-ended work: questions, investigation, meta-tasks, anything that doesn't fit a structured pathway"
  initial_state: free
  sequence: [free]
  loop: true
  guidance:
    free:
      - 'You have all tools available. Use whatever serves the task.'
      - 'Checkpoint findings via task_update regularly -- this work is worth remembering'
      - 'Re-evaluate after each checkpoint: done? Evolved into a known pattern? Continue?'
      - 'If work crystallizes into a structured workflow, transition: task_create with the right pathway'
      - "When done: task_update(status='completed') and exit_state"
  exit_criteria:
    free:
      - 'Findings checkpointed via task_update at least once'
      - 'Re-evaluation done: task is either completed or reclassified into a structured pathway'

introspect:
  description: 'Self-audit: evaluate Cortex internals, identify improvements, implement changes'
  initial_state: recon
  sequence: [recon, plan, implement, validate]
  guidance:
    recon:
      - 'Identify the Cortex subsystem to audit (instructions, states, pathways, tools, storage)'
      - 'Read the relevant source files end-to-end'
      - 'Audit for: token waste, temporal misplacement, redundancy, dead code'
      - 'Use free_explore_analysis to check for recurring escape patterns'
      - 'recon_checkpoint with structured audit results'
    plan:
      - 'Quantify: token count before vs after'
      - 'Map each move to exact file and location'
      - 'Verify no information is lost'
      - 'plan_approve when the edit list is concrete'
    implement:
      - 'Edit in dependency order -- types first, then consumers'
      - 'impl_test after each file'
      - 'impl_checkpoint with before/after comparison'
    validate:
      - 'Full vitest suite green'
      - 'Inspector-connect to built Cortex'
      - 'Verify tools surface at correct temporal point'
      - 'Check for zero error events'
  exit_criteria:
    recon:
      - 'Target subsystem audited end-to-end'
      - 'Findings classified (keep / move / remove) with specific targets'
      - 'Escape-log patterns consulted via free_explore_analysis'
    plan:
      - 'Before/after token comparison quantified'
      - 'Each move mapped to an exact destination'
      - 'plan_approve called'
    implement:
      - 'Edits made in dependency order (types first, consumers after)'
      - 'impl_test green after each file'
    validate:
      - 'Full vitest suite green'
      - 'Inspector round-trip confirms the change took effect'

diagnose:
  description: 'Diagnostic-only: find and document root cause, then hand off. No code change in this pathway -- use investigation for bug hunts that need a fix.'
  initial_state: debug
  sequence: [debug]
  loop: true
  guidance:
    debug:
      l1:
        - 'Pick ONE representative case -- specific entity, request, or ID'
        - 'Classify intent: DATA issue, CONFIG gap, CODE bug, or INFORMATIONAL (pure research/trace). Each routes to a different handoff.'
        - 'Find a CONTROL CASE before deep-diving the broken one. Compare side-by-side.'
        - 'debug_hypothesis with confidence % before querying anything'
        - 'Check your observability platform first for logs. Scope every query to env (sandbox / staging / production) -- platforms that span envs return mixed results without scoping.'
        - 'Include audit metadata (updatedAt/updatedBy or equivalent) in every database read. Mutations during the investigation are invisible without it.'
        - "Ask the NORMAL mechanism first ('how does X work'), THEN the recovery mechanism. Docs describe both -- conflating them causes misdiagnosis."
        - 'debug_advance to L2 when hypothesis points at data or config'
      l2:
        - 'debug_db_query for database investigation; include audit metadata projections so mutations show on the first query.'
        - 'insp_connect + insp_tools_call -- introspect live services via their MCP surface when a tool-level reproducer helps'
        - 'On long diagnostics, re-query audit metadata periodically to catch external mutations under you.'
        - 'debug_advance to L3 if cross-service correlation is needed'
      l3:
        - 'debug_distributed_trace for cross-service correlation if applicable'
        - 'debug_root_cause when you have evidence; document the handoff path (who acts, where, by when)'
        - 'Pathway check: if this starts leading to a code change, transition to investigation via a new task.'
  exit_criteria:
    debug:
      l1:
        - 'Hypothesis stated with confidence %'
        - 'Classification recorded: DATA / CONFIG / CODE / INFORMATIONAL'
        - 'Control case identified, or explicit note that none exists'
        - 'Observability queries scoped to env'
      l2:
        - 'Audit metadata checked on the broken-case document'
      l3:
        - 'Root cause confirmed with evidence array via debug_root_cause'
        - 'Handoff path recorded: who acts, where, by when'

coach:
  description: 'Active-recall coaching loop. Short single-concept sessions, top-3 pick entry, durable findings, cap-3 anti-overwhelm on revisits.'
  initial_state: coach
  sequence: [coach]
  loop: true
  guidance:
    coach:
      - 'First move: coach_resume. Single call. Surfaces top-3 open revisits + most recent parked thread. User picks 1, 2, 3, parked, or a new concept name.'
      - 'Default cadence: short single-concept sessions. Long-form research is opt-in via enter_state("recon"), validation hands-on via enter_state("validate").'
      - 'Question style rotation: concept | scenario | debug | predict | teach_back | simulate_call. Pick one each round; never repeat last round.'
      - 'coach_quiz to record: concept, question, user answer, Bloom level (1-6), style, assessment (strong / partial / weak).'
      - 'Adaptive jump: assessment=strong -> next question one Bloom level up + different style. partial -> teach_back on same concept. weak -> coach_gap then coach_revisit, move on.'
      - 'coach_gap when user articulates something fuzzy. Capture user_said vs correct + gap_type (mental_model | terminology | edge_case | why | connection). Re-explain with a different concrete example.'
      - 'coach_revisit to queue weak concepts. No date, no interval. Cap-3 enforcement is in coach_resume -- older entries stay in audit trail but never become a backlog cliff.'
      - 'coach_thread_park the moment user pivots. Park, follow the new thread, return next session.'
      - 'When deep-research is genuinely required (foundation missing, multiple concepts entangled): enter_state("recon") for one focused excursion, recon_checkpoint with a one-paragraph summary, return to coach. Do not stay in recon.'
      - 'When hands-on exercise required: enter_state("validate") L2 to trace one real entity. Capture concrete example as a finding, return to coach.'
      - 'When user curious about a cross-domain connection: enter_state("free") for one short wander. Set a timer.'
      - 'End-of-session: optional one-line teaser of next concept (not enforced).'
  exit_criteria:
    coach:
      - 'At least one coach_quiz round recorded this session'
      - 'If any assessment was weak/partial: a coach_gap and coach_revisit pair exists for it'

telemetry_review:
  description: 'Monthly harness telemetry rollup. Runs headless via Task Scheduler; pushes digest to the forum + a one-line subconscious inject. Driven by ~/dev/harness-telemetry.'
  initial_state: free
  sequence: [free]
  loop: true
  guidance:
    free:
      - 'Run: python ~/dev/harness-telemetry/aggregator.py  (produces JSON digests + sanitized YYYY-MM.md)'
      - 'Auto-classify untagged cortex tasks (pathway + tool-set); list drift.'
      - 'Pair mcp-cost resource snapshot with tool-call counts; list IDLE-EXPENSIVE + zero-call servers as clutter.'
      - 'Read ~/.cortex/_free_explore_log.jsonl (full escape list every 3rd run / quarterly depth).'
      - 'PUSH: post the digest to the forum (subject-line delivery) AND inject the one-line headline via subconscious inject. Use CRUCIAL INFORMATION FOR EREN: opener only if an instrument is dark.'
      - 'Sanitize, then commit YYYY-MM.md to ~/dev/harness-telemetry.'
      - "task_update(status='completed')."
  exit_criteria:
    free:
      - 'check.py exits 0 over the fresh digests'
      - 'forum post exists for the month + digests/YYYY-MM.md committed with a current timestamp'
