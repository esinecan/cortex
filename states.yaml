base:
  description: 'Default state. Task management and state selection available.'
  tools: [suggest_state]
  external_guidance:
    use: []
    avoid: []
  constraints: []

recon:
  description: 'Reconnaissance. Understand before acting. Read first, write when needed.'
  tools:
    - recon_sweep
    - recon_checkpoint
  external_guidance:
    use: [read, grep, glob]
    avoid: [edit, write, bash_destructive]
  constraints:
    - 'Do NOT edit code files -- this is understanding phase'
    - 'Prefer reads first. Write (tickets, comments, pages) when needed.'
    - 'Save all findings via recon_checkpoint'
  skill_suggestions: [superpowers:brainstorming]

plan:
  description: 'Structured planning. Produce a plan, validate it, get approval.'
  tools: [plan_draft, plan_validate, plan_approve]
  external_guidance:
    use: [read, grep, glob]
    avoid: [edit, write]
  constraints:
    - 'Do NOT edit files until plan is approved'
  skill_suggestions: [superpowers:writing-plans]

implement:
  description: 'Active coding. Write code, run tests, checkpoint progress.'
  tools:
    - impl_checkpoint
    - impl_test
    - impl_stuck
  external_guidance:
    use: [edit, write, bash, read, grep, glob]
    avoid: []
  constraints:
    - 'Run tests after changes'
    - 'Checkpoint regularly'
  skill_suggestions: [superpowers:test-driven-development]

debug:
  description: 'Progressive debugging. Start with hypothesis + logs, escalate to database, then cross-service tracing.'
  levels:
    1:
      tools:
        - debug_hypothesis
        - debug_log_check
        - debug_advance
      external_guidance:
        use: [read, grep, glob]
        avoid: [edit, write]
      constraints:
        - 'Form hypotheses before querying'
        - 'Your observability platform aggregates across services -- use it first (could be an external tool paired with cortex)'
        - 'Scope every observability query to the environment under investigation. A platform that spans sandbox/staging/production returns mixed results without an env filter.'
        - 'Include audit metadata (updatedAt/updatedBy or equivalent) in every database read so document mutations during the investigation are visible on the first query, not the fourth.'
    2:
      inherits: 1
      additional_tools:
        - debug_db_query
      constraints:
        - 'Use entity map for database navigation (could be an external tool paired with cortex)'
        - 'On long investigations, re-check audit metadata periodically -- live systems mutate while you investigate.'
    3:
      inherits: 2
      additional_tools:
        - debug_distributed_trace
        - debug_root_cause
      constraints:
        - 'Trace correlation IDs across services'
        - 'Record root cause with evidence array via debug_root_cause'
  skill_suggestions: [superpowers:systematic-debugging]

validate:
  description: 'Verify changes work. Progressive: local gates, flow checks, browser E2E.'
  levels:
    1:
      tools:
        - validate_prerequisites
        - validate_setup
        - validate_advance
      external_guidance:
        use: [bash, read, grep]
        avoid: [edit, write]
      constraints:
        - 'Run validate_prerequisites before manual checks'
        - 'Use validate_setup for recipes -- do not guess configurations'
    2:
      inherits: 1
      additional_tools:
        - validate_integration_flow
      constraints:
        - 'Use validate_integration_flow to check pipeline stage health for an entity'
        - 'Cross-reference with your database tools if discrepancies found (could be an external tool paired with cortex)'
    3:
      inherits: 2
      additional_tools: []
      additional_external_guidance:
        use: [playwright]
      constraints:
        - 'browser_snapshot before every interaction'
        - 'Take screenshots as verification evidence'
  skill_suggestions: [superpowers:verification-before-completion]

review:
  description: 'Self-review and PR preparation.'
  tools:
    - review_diff_summary
    - review_simulate
    - review_checklist
    - review_ready
  external_guidance:
    use: [git, read, grep]
    avoid: [edit, write]
  constraints:
    - 'Simulate relevant reviewer archetypes with review_simulate'
    - 'Run review_checklist before marking ready'
    - 'Use GitHub PR tools to check for parallel open PRs in the same area'
  skill_suggestions: [superpowers:requesting-code-review]

browse:
  description: 'Focus state. Browser automation with Playwright tools.'
  tools:
    - browse_capture
  external_guidance:
    use: []
    avoid: [everything_else]
  constraints:
    - 'Use browser_snapshot to see page state before acting'
    - "Use browser_evaluate for anything the other tools can't do"
    - 'Record research findings via browse_capture'

free:
  description: 'Open-ended mode. All tools available. No constraints.'
  tools: []
  external_guidance:
    use: [all]
    avoid: []
  constraints: []

coach:
  description: 'Active-recall coaching loop. Lean surface, durable findings, cap-3 on revisits so re-entry is always cheap.'
  tools:
    - coach_resume
    - coach_quiz
    - coach_gap
    - coach_revisit
    - coach_thread_park
  external_guidance:
    use: [read]
    avoid: [edit, write, bash_destructive]
  constraints:
    - 'First move every session: coach_resume. Single-call entry, top-3 pick.'
    - 'Default cadence: short single-concept sessions. Long-form research is opt-in via enter_state("recon").'
    - 'Rotate question style across rounds (concept / scenario / debug / predict / teach_back / simulate_call). Repeating the same stem twice = drift trigger.'
    - 'Adaptive jump: if assessment=strong, next question is one Bloom level up with a different style. No grinding.'
    - 'If user pivots mid-session, coach_thread_park first, then follow.'
    - 'Cap-3 on revisits is enforced by coach_resume. Older entries stay in the audit trail but never become a backlog cliff.'
    - 'No streaks, no scores. Bloom level + assessment is enough signal.'
